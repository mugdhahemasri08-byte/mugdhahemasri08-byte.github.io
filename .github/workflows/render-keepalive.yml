name: Keep Render Ask API Alive

on:
  schedule:
    - cron: "*/15 * * * *"   # runs every 15 minutes
  workflow_dispatch:

jobs:
  ping-ask-api:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Ask API
        run: |
          curl -X POST https://chat-backend-n8t7.onrender.com/api/ask \
          -H "Content-Type: application/json" \
          -d '{"prompt":"health check"}'
