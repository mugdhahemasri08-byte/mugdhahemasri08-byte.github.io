<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RAG SEARCH</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #bc8f8f;
      --primary-light: #f4eaea;
      --primary-soft: #ead7d7;
      --text-dark: #2f2f2f;
      --text-light: #6f6f6f;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--primary-light), var(--primary-soft));
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }

    .app-container {
      width: 100%;
      max-width: 780px;
      background: rgba(255,255,255,0.95);
      border-radius: 22px;
      padding: 36px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.15);
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
      color: var(--primary);
      letter-spacing: 0.3px;
    }

    .header p {
      margin-top: 8px;
      font-size: 14px;
      color: var(--text-light);
      line-height: 1.5;
    }

    textarea {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid #ddd;
      resize: none;
      font-size: 14px;
      transition: 0.2s ease;
    }

    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(188,143,143,0.25);
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border-radius: 35px;
      border: none;
      background: linear-gradient(135deg, var(--primary), #a57878);
      color: white;
      font-size: 15px;
      cursor: pointer;
      transition: 0.25s;
      font-weight: 500;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(188,143,143,0.35);
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .output {
      margin-top: 22px;
      background: var(--primary-light);
      padding: 20px;
      border-radius: 18px;
      font-size: 14px;
      white-space: pre-wrap;
      min-height: 140px;
      color: var(--text-dark);
      overflow-x: auto;
      line-height: 1.6;
      border: 1px solid rgba(0,0,0,0.05);
    }

    .footer {
      text-align: center;
      margin-top: 22px;
      font-size: 12px;
      color: var(--text-light);
    }

    .footer span {
      color: var(--primary);
      font-weight: 600;
    }

    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-light);
      opacity: 0.95;
    }
  </style>
</head>

<body>

  <div class="app-container">

    <div class="header">
      <h1>RAG SEARCH</h1>
      <p>
        Ask questions powered by <b>RAG (Retrieval-Augmented Generation)</b><br />
        using BSE Knowledge Base.
      </p>
      <div class="hint">
        Example: <i>What is BSE?</i> • <i>What is Sensex?</i> • <i>How do companies list on BSE?</i>
      </div>
    </div>

    <textarea id="question" rows="4" placeholder="Ask your question about BSE...(Rag Seach will work vary rarely as it has free tier has quota limit issues)"></textarea>

    <button id="searchBtn" onclick="ragSearch()">Ask</button>

    <div class="output" id="output">
      Answer will appear here ✨
    </div>

    <div class="footer">
      Developed by <span>Hema Sri</span> • RAG AI System
    </div>

  </div>

  <!-- ✅ MUST load config.js first -->
  <script src="config.js"></script>

  <script>
    async function ragSearch() {
      const question = document.getElementById("question").value.trim();
      const output = document.getElementById("output");
      const btn = document.getElementById("searchBtn");

      if (!question) {
        alert("Please enter a question");
        return;
      }

      // ✅ Make sure config is loaded
      if (typeof API_URLS === "undefined" || !API_URLS.RAGSEARCH) {
        output.innerText = "❌ config.js not loaded or API_URLS.RAGSEARCH missing";
        return;
      }

      output.innerText = "Thinking... 🤔";
      btn.disabled = true;
      btn.innerText = "Searching...";

      try {
        const res = await fetch(API_URLS.RAGSEARCH, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: question })   // ✅ curl-compatible
        });

        const data = await res.json().catch(() => null);

        if (!res.ok) {
          output.innerText =
            `❌ Backend Error (HTTP ${res.status})\n\n` +
            (data?.response || data?.error || data?.message || "Unknown error");
          return;
        }

        const answer = data?.response || "✅ No response received";

        // ✅ show sources if backend sends sources
        let sourcesText = "";
        if (Array.isArray(data?.sources) && data.sources.length > 0) {
          sourcesText = "\n\n📌 Sources:\n- " + data.sources.join("\n- ");
        }

        output.innerText = answer + sourcesText;

      } catch (err) {
        console.error(err);
        output.innerText = "❌ Error connecting to backend. Please check server & CORS.";
      } finally {
        btn.disabled = false;
        btn.innerText = "Ask";
      }
    }

    // ✅ Enter submits (Shift+Enter for new line)
    document.getElementById("question").addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        ragSearch();
      }
    });
  </script>

</body>
</html>
